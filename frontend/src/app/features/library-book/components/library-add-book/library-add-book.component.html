<section class="p-4">
  <app-page-header [title]="'Add a book to a library'"></app-page-header>

  <form (ngSubmit)="onSubmit()" class="text-center">
    @if (books) {
      <div class="mt-3">
        <label for="book">Book:</label>
        <br>
        <select id="book" name="book" [(ngModel)]="bookId" class="text-bgSecondary mt-1 p-1 w-80">
          @for (book of books.libraryBooks; track trackById(book)) {
            <option [value]="trackById(book)">
              {{ getBookTitle(book.bookId) }}
            </option>
          }
        </select>
      </div>
    }

    @if (libraryBook) {
      <div class="mt-3">
        <label for="numberOfCopies">Number of copies:</label>
        <br>
        <input type="number" id="numberOfCopies" name="numberOfCopies" min="1" [(ngModel)]="libraryBook.numberOfCopies" class="text-bgSecondary mt-1 p-1 w-80">
      </div>
    }

    <div class="text-center mt-5">
      <button type="submit" class="rounded-md bg-bgSecondary text-primary px-4 py-2 mx-auto my-1 w-36 h-10 mr-3">
        Submit
      </button>
      <button [routerLink]="[LIBRARIES, libraryId]" class="rounded-md bg-bgSecondary text-primary px-4 py-2 mx-auto my-1 w-36 h-10">
        Cancel
      </button>
    </div>
  </form>
</section>
