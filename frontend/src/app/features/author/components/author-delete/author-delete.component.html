<section class="p-4">
  <app-page-header title="Delete authors"/>

  @if (authors) {
    <div class="grid gap-4 w-full max-w-xl mx-auto">
      @for (author of authors.authors; track author.id) {
        <div class="flex gap-4 justify-center">
          <p class="bg-bgSecondary p-2 rounded-md shadow-md w-64 h-12 flex items-center justify-center">
            <a [routerLink]="getAuthorLink(author)" class="hover:underline">
              {{ author.firstName }} {{ author.lastName }}
            </a>
          </p>
          <button (click)="onDeleteButtonClicked(author.id)" class="bg-bgSecondary p-2 rounded-md shadow-md text-center w-12 h-12 text-2xl">
            X
          </button>
        </div>
      }
    </div>
  }
  
  <div class="text-center mt-12">
    <hr class="w-64 mb-4 mx-auto">
    <button [routerLink]="AUTHORS" class="rounded-md bg-bgSecondary text-primary px-4 py-2 mx-auto my-1 w-36 h-10">
      Return
    </button>
  </div>
</section>
