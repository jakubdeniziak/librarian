<section class="p-4">
  <app-page-header title="Add an author"/>

  @if (author) {
    <form (ngSubmit)="onSubmit()" class="max-w-lg mx-auto">
      <div class="flex items-center mb-3">
        <label for="firstName" class="w-32 text-right mr-3">First name:</label>
        <input
          id="firstName"
          name="firstName"
          [(ngModel)]="author.firstName"
          class="flex-1 text-primary p-2 border border-secondary rounded bg-transparent"
        />
      </div>

      <div class="flex items-center mb-3">
        <label for="lastName" class="w-32 text-right mr-3">Last name:</label>
        <input
          id="lastName"
          name="lastName"
          [(ngModel)]="author.lastName"
          class="flex-1 text-primary p-2 border border-secondary rounded bg-transparent"
        />
      </div>

      <div class="flex items-start mb-3">
        <label for="description" class="w-32 text-right mr-3 pt-2">Description:</label>
        <textarea
          id="description"
          name="description"
          [(ngModel)]="author.description"
          class="flex-1 text-primary p-2 border border-secondary rounded bg-transparent"
          rows="5"
        ></textarea>
      </div>

      <div class="flex justify-center gap-3 mt-5">
        <button
          type="submit"
          class="rounded-md bg-bgSecondary text-primary px-4 py-2 w-36 h-10"
        >
          Submit
        </button>
        <button
          [routerLink]="AUTHORS"
          class="rounded-md bg-bgSecondary text-primary px-4 py-2 w-36 h-10"
        >
          Cancel
        </button>
      </div>
    </form>
  }
</section>
