@if (author) {
  <section class="p-4 text-center">
    <app-page-header [title]="author.firstName + ' ' + author.lastName"/>

    <h3 class="text-xl font-bold mt-5">Description</h3>
    <p class="mt-1">
      {{ author.description }}
    </p>

    @if (books && books.books.length > 0) {
      <h3 class="text-xl font-bold mt-5">Books</h3>
      <div class="grid gap-2 w-1/6 mx-auto mt-1">
        @for (book of books.books; track book.id) {
          <a [routerLink]="[BOOKS, book.id]" class="bg-bgSecondary p-2 rounded-md shadow-md text-center hover:underline">
            {{ book.title }}
          </a>
        }
      </div>
    }

    @if (userService.isAdmin()) {
      <div class="text-center mt-4">
        <h3 class="text-xl font-bold">Manage</h3>
        <button [routerLink]="[AUTHORS, author.id, 'edit']" class="rounded-md bg-bgSecondary text-primary px-4 py-2 mx-auto my-1 w-36 h-10">
          Edit
        </button>
      </div>
    }
    <button [routerLink]="AUTHORS" class="rounded-md bg-bgSecondary text-primary px-4 py-2 mx-auto my-1 w-36 h-10">
      Return
    </button>
  </section>
}
