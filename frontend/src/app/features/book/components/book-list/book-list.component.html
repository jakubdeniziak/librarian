<section class="p-4">
  <app-page-header title="Books"/>

  @if (books) {
    <div class="grid gap-4 w-1/6 mx-auto">
      @for (book of books.books; track book.id) {
        <p class="bg-bgSecondary p-2 rounded-md shadow-md text-center">
          <a [routerLink]="[BOOKS, book.id]" class="hover:underline">
            {{ book.title }}
          </a>
        </p>
      }
    </div>
  }

  @if (userService.isAdmin()) {
    <div class="text-center mt-4">
      <h3 class="text-xl font-bold">Manage</h3>
      <button [routerLink]="[BOOKS, 'add']" class="rounded-md bg-bgSecondary text-primary px-4 py-2 mx-auto my-1 w-36 h-10">
        Add
      </button>
      <br>
      <button [routerLink]="[BOOKS, 'delete']" class="rounded-md bg-bgSecondary text-primary px-4 py-2 mx-auto my-1 w-36 h-10">
        Remove
      </button>
    </div>
  }
</section>
