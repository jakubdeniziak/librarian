<section class="p-4">
  <app-page-header title="Libraries"/>

  @if (libraries) {
    <div class="grid gap-4 w-1/6 mx-auto">
      @for (library of libraries.libraries; track library.id) {
        <p class="bg-bgSecondary p-2 rounded-md shadow-md text-center">
          <a [routerLink]="[LIBRARIES, library.id]" class="hover:underline">
            {{ library.name }}
          </a>
        </p>
      }
    </div>
  }

  <div class="text-center">
    <hr class="mx-auto my-4 w-3/12">
    <h3 class="text-xl font-bold">Manage</h3>
    <button [routerLink]="[LIBRARIES, 'add']" class="rounded-md bg-bgSecondary text-primary px-4 py-2 mx-auto my-1 w-36 h-10">
      Add
    </button>
    <br>
    <button [routerLink]="[LIBRARIES, 'delete']" class="rounded-md bg-bgSecondary text-primary px-4 py-2 mx-auto my-1 w-36 h-10">
      Remove
    </button>
    <br>
    <br>
    <button routerLink="/" class="rounded-md bg-bgSecondary text-primary px-4 py-2 mx-auto my-1 w-36 h-10">
      Return
    </button>
  </div>
</section>
