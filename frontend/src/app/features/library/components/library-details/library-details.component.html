<section class="p-4 text-center">
  <app-page-header [title]="library?.name" [subtitle]="library?.address"></app-page-header>

  <h3 class="text-xl font-bold mt-5">Description</h3>
  <p class="mt-1">
    {{ library?.description }}
  </p>

  @if (library) {
    <app-library-book-list [libraryId]="library.id"></app-library-book-list>
  }

  <div class="text-center mt-4">
    <h3 class="text-xl font-bold">Manage</h3>
    <button [routerLink]="[LIBRARIES, library?.id, 'add-book']" class="rounded-md bg-bgSecondary text-primary px-4 py-2 mx-auto my-1 w-36 h-10">
      Add book
    </button>
  </div>
</section>
