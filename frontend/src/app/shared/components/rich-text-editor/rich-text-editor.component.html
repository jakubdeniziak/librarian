<div class="w-full">
  <label class="block text-sm font-semibold text-secondary mb-2">{{ label }}</label>

  <div class="rounded-2xl border border-white/10 bg-bgSecondary overflow-hidden">
    <div class="flex flex-wrap items-center gap-1 px-3 py-2 border-b border-white/10 bg-bgPrimary/30">
      <button type="button" class="rte-btn" [class.rte-btn--active]="formatState.bold" (mousedown)="$event.preventDefault()" (click)="format('bold')" [disabled]="disabled" title="Bold">
        <span class="font-bold">B</span>
      </button>
      <button type="button" class="rte-btn" [class.rte-btn--active]="formatState.italic" (mousedown)="$event.preventDefault()" (click)="format('italic')" [disabled]="disabled" title="Italic">
        <span class="italic">I</span>
      </button>
      <span class="mx-1 h-5 w-px bg-white/10"></span>
      <button type="button" class="rte-btn" [class.rte-btn--active]="formatState.link" (mousedown)="$event.preventDefault()" (click)="openLinkPopup()" [disabled]="disabled" title="Insert link">
        Link
      </button>
      <button type="button" class="rte-btn" (mousedown)="$event.preventDefault()" (click)="removeLink()" [disabled]="disabled" title="Remove link">
        Unlink
      </button>
      <span class="mx-1 h-5 w-px bg-white/10"></span>
      <button type="button" class="rte-btn" (mousedown)="$event.preventDefault()" (click)="clearFormatting()" [disabled]="disabled" title="Clear formatting">
        Clear
      </button>
    </div>

    <div
      #editor
      class="rte-editor px-4 py-3 text-primary outline-none"
      [style.min-height.px]="minHeightPx"
      (input)="onInput()"
      (mouseup)="onSelectionChanged()"
      (keyup)="onSelectionChanged()"
      (focus)="onSelectionChanged()"
      (blur)="markTouched()"
      (keydown)="onKeydown()"
      [attr.data-placeholder]="placeholder"
      role="textbox"
      aria-multiline="true"
    ></div>

    @if (linkPopupOpen) {
      <div class="rte-popup-backdrop" (mousedown)="closeLinkPopup()">
        <div class="rte-popup" (mousedown)="$event.stopPropagation()">
          <p class="text-sm font-semibold text-primary mb-2">Insert link</p>

          <label class="block text-xs text-secondary mb-1">URL</label>
          <input
            type="url"
            class="rte-popup-input"
            [(ngModel)]="linkUrl"
            placeholder="https://example.com"
            (keydown.enter)="$event.preventDefault(); $event.stopPropagation(); confirmLink()"
            (keydown.escape)="closeLinkPopup()"
          />

          <div class="mt-3 flex items-center justify-end gap-2">
            <button type="button" class="rte-btn" (click)="closeLinkPopup()">Cancel</button>
            <button type="button" class="rte-btn rte-btn--primary" (click)="confirmLink()" [disabled]="!linkUrl.trim()">
              Insert
            </button>
          </div>
        </div>
      </div>
    }
  </div>

  @if (helpText) {
    <p class="text-xs text-secondary mt-2">{{ helpText }}</p>
  }
</div>
