<header class="text-center my-4">
  <h2 class="text-4xl font-bold">
    @if (titleLink) {
      <a [href]="titleLink" target="_blank" class="hover:underline">
        {{ title }}
      </a>
    } @else {
      {{ title }}
    }
  </h2>

  @if (subtitle) {
    <p>
      {{ subtitle }}
    </p>
  }
</header>
